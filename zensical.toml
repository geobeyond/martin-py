[project]
site_name = "martin-py"
site_description = "Serve Martin tile sources (PMTiles, GeoJSON, DuckDB/GeoParquet) in-process from Python"
site_url = "https://geobeyond.github.io/martin-py/"
repo_url = "https://github.com/geobeyond/martin-py"
repo_name = "geobeyond/martin-py"
docs_dir = "docs"
site_dir = "site"
nav = [
  "index.md",
  { "User guide" = [
    { "Configuration" = "user-guide/configuration.md" },
    { "Serving tiles" = "user-guide/serving-tiles.md" },
    { "Async" = "user-guide/async.md" },
  ] },
  { "API reference" = "reference/" },
  { "Examples" = [
    { "FastAPI tile API" = "examples/fastapi.md" },
  ] },
  { "Development" = "development/index.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

# the API reference is generated from the docstrings in src/martin_py, see the "Documentation"
# section of docs/development/index.md
[project.plugins.api-autonav]
modules = ["src/martin_py"]
api_root_uri = "reference"
nav_section_title = "API reference"
exclude_private = true

[project.plugins.api-autonav.module_options.".*"]
heading_level = 1
show_symbol_type_heading = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# only read the .pyi stub of the compiled martin_py._core module, so that the output does not depend
# on whether the extension has been built
allow_inspection = false
inherited_members = true
merge_init_into_class = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
# hides "Bases: TileServer", which would point to the private martin_py._core.TileServer
show_bases = false
show_source = false
