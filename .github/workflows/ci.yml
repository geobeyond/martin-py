name: Continuous Integration

on:
  push:
    branches:
      - main
    # pushing a version tag (e.g. v0.1.0) also publishes the wheel as a GitHub Release asset
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  lint_rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Format Rust code"
        run: cargo fmt --check

      - name: "Lint Rust code"
        run: cargo clippy --all-targets -- --deny warnings

  run_ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release on version tags
    steps:
      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Run Rust tests"
        # generous: the first build compiles DuckDB from source
        timeout-minutes: 45
        run: cargo test --verbose

      - name: "Install Python code with dev dependencies"
        run: uv sync --group dev

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Run ty"
        run: uv run ty check

      - name: "Run Python tests"
        timeout-minutes: 10
        run: uv run pytest

      - name: "Build release wheel"
        timeout-minutes: 45
        run: uv run maturin build --release --compatibility linux --features postgres,mbtiles

      - name: "Read wheel version"
        id: wheel
        # wheel filename: <name>-<version>-<python tag>-<abi tag>-<platform tag>.whl
        run: |
          wheel=$(ls target/wheels/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Downloadable from other repositories, e.g. with actions/download-artifact using
      # `repository: <owner>/martin-py`, `run-id: <run id>` and a `github-token` with actions:read on this repo.
      - name: "Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: martin-py-${{ steps.wheel.outputs.version }}-wheel-linux
          path: target/wheels/*.whl
          if-no-files-found: error

      # Public, stable .whl URL for other projects (fastgeoapi points its uv source at it):
      #   https://github.com/<owner>/martin-py/releases/download/v<version>/<wheel filename>
      - name: "Publish wheel to GitHub Release"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.wheel.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the crate version $VERSION (Cargo.toml [workspace.package])"
            exit 1
          fi
          gh release create "$TAG" target/wheels/*.whl --title "$TAG" --generate-notes
