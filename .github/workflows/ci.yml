name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint_rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Format Rust code"
        run: cargo fmt --check

      - name: "Lint Rust code"
        run: cargo clippy --all-targets -- --deny warnings

  run_ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Run Rust tests"
        # generous: the first build compiles DuckDB from source
        timeout-minutes: 45
        run: cargo test --verbose

      - name: "Install Python code with dev dependencies"
        run: uv sync --group dev

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Run ty"
        run: uv run ty check

      - name: "Run Python tests"
        timeout-minutes: 10
        run: uv run pytest

      - name: "Build release wheel"
        timeout-minutes: 45
        run: uv run maturin build --release --compatibility linux --features postgres,mbtiles

      - name: "Read wheel version"
        id: wheel
        # wheel filename: <name>-<version>-<python tag>-<abi tag>-<platform tag>.whl
        run: |
          wheel=$(ls target/wheels/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Downloadable from other repositories, e.g. with actions/download-artifact using
      # `repository: <owner>/martin-py`, `run-id: <run id>` and a `github-token` with actions:read on this repo.
      - name: "Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: martin-py-${{ steps.wheel.outputs.version }}-wheel-linux
          path: target/wheels/*.whl
          if-no-files-found: error
